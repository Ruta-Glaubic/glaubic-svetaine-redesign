<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLAUBIC mobili peržiūra</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;700&family=Manrope:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --violet-100: #ECEEFB; --violet-500: #9AA2E6; --ink-800: #322838; --ink-600: #6B6072; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--violet-100);
    color: var(--ink-800);
    font-family: "Hanken Grotesk", system-ui, sans-serif;
  }
  header { max-width: 1100px; margin: 0 auto; padding: 40px 24px 8px; }
  h1 { font-family: "Manrope", system-ui, sans-serif; font-size: 34px; letter-spacing: -0.03em; margin: 0; }
  header p { margin: 10px 0 0; color: var(--ink-600); max-width: 48em; }
  .phones { display: flex; flex-wrap: wrap; justify-content: center; gap: 40px; padding: 32px 24px 56px; }
  figure { margin: 0; text-align: center; }
  figcaption { margin-top: 14px; font-weight: 700; }
  figcaption a { color: inherit; font-weight: 400; margin-left: 8px; }
  .phone {
    width: 414px;
    height: 868px;
    padding: 12px;
    border-radius: 48px;
    background: var(--ink-800);
    box-shadow: 0 24px 48px rgba(36, 29, 43, 0.25);
  }
  .phone iframe { width: 390px; height: 844px; border: 0; border-radius: 36px; background: #fff; display: block; }
</style>
</head>
<body>
<header>
  <h1>Mobili versija</h1>
  <p>Telefonas 390 × 844 px. Puslapius galima slinkti ir spaudyti kaip telefone. Jei rėmeliai tušti, abu failai turi būti tame pačiame aplanke kaip šis failas.</p>
</header>
<main class="phones">
  <figure>
    <div class="phone"><iframe src="2026-09-27-glaubic-maketas.html" title="Pagrindinis puslapis telefone"></iframe></div>
    <figcaption>Pagrindinis puslapis <a href="2026-09-27-glaubic-maketas.html">atidaryti</a></figcaption>
  </figure>
  <figure>
    <div class="phone"><iframe src="2026-09-27-glaubic-duk.html" title="DUK puslapis telefone"></iframe></div>
    <figcaption>DUK puslapis <a href="2026-09-27-glaubic-duk.html">atidaryti</a></figcaption>
  </figure>
</main>
</body>
</html>
