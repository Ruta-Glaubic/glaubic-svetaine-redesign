<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09 Pasiūlymas – GLAUBIC laiškai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;700&family=Manrope:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="2026-09-28-laiskai-bendra.css">
</head>
<body>
<script src="2026-09-28-laiskai-bendra.js"></script>
<script>
GLAUBIC.page({
  no: 9,
  pill: "Alumni pasiūlymas",
  marketing: true,
  goal: "Pakartotinis pirkimas: pažengusiųjų mokymai, komandų mokymai, automatizacijos konsultacija ir alumni nuolaida su terminu.",
  fields: ["discount", "discountCode", "deadline", "offerUrl", "unsubscribeUrl", "logoUrl"],
  subject: function (x, k) { return "Kitas žingsnis su Claude" + (x.discount ? ": " + x.discount + " nuolaida mokymų dalyviams" : ""); },
  preheader: function (x, k) { return "Pažengusiųjų mokymai, mokymai komandai ir automatizacijos konsultacija."; },
  body: function (x, k) {
    function option(title, text) {
      return '<tr><td style="padding:0 32px 14px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border:2px solid ' + k.C.violet200 + ';border-radius:18px;"><tr><td style="padding:16px 20px;">' +
        '<p style="margin:0 0 4px;font-family:Manrope,Arial,sans-serif;font-size:17px;font-weight:700;line-height:24px;color:' + k.C.ink + ';">' + title + '</p>' +
        '<p style="margin:0;font-family:Arial,sans-serif;font-size:15px;line-height:23px;color:' + k.C.ink + ';">' + text + '</p></td></tr></table></td></tr>';
    }
    return k.p("jau kelias savaites dirbate su Claude. Jei norite žengti toliau, parengėme pasiūlymą mokymų dalyviams.") +
      option("Pažengusiųjų mokymai", "„AI agentai ir Claude kartu“ ir „Susikurkite AI agentą per 3 val.“: nuo pavienių užduočių pereiname prie agentų, kurie dirba už jus.") +
      option("Mokymai jūsų komandai", "Programą pritaikome jūsų įmonės procesams ir įrankiams, kad visa komanda dirbtų vienodai efektyviai.") +
      option("Automatizacijos konsultacija", "Kartu įvertiname, kurias užduotis verta automatizuoti su Claude, n8n ar AI agentais, ir sudarome planą.") +
      k.card(
        k.cardLabel("Tik mokymų dalyviams") +
        '<p style="margin:0 0 8px;font-family:Manrope,Arial,sans-serif;font-size:26px;font-weight:700;line-height:32px;color:' + k.C.ink + ';">' + k.v("discount") + ' nuolaida</p>' +
        k.cardText("Su kodu <b>" + k.v("discountCode") + "</b>. Galioja iki " + k.v("deadline") + ".") +
        k.button(k.u("offerUrl"), "Peržiūrėti mokymus", "outline"),
        { bg: k.C.yellow }) +
      k.p("Domina mokymai komandai ar konsultacija? Atsakykite į šį laišką ir susiderinsime trumpą pokalbį.");
  }
});
</script>
</body>
</html>
