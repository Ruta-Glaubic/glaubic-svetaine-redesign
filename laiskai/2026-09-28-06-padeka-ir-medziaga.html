<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>06 Padėka ir medžiaga – GLAUBIC laiškai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;700&family=Manrope:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="2026-09-28-laiskai-bendra.css">
</head>
<body>
<script src="2026-09-28-laiskai-bendra.js"></script>
<script>
GLAUBIC.page({
  no: 6,
  pill: "Ačiū!",
  pillColor: "coral",
  marketing: true,
  goal: "Suteikti vertės ir surinkti atsiliepimą: skaidrės, užklausų šablonai, NPS anketa.",
  fields: ["title", "date", "materialsUrl", "npsUrl", "unsubscribeUrl", "logoUrl"],
  subject: function (x, k) { return "Ačiū! Mokymų medžiaga ir vienas klausimas"; },
  preheader: function (x, k) { return "Skaidrės ir užklausų šablonai jau jūsų. Kaip įvertintumėte mokymus?"; },
  body: function (x, k) {
    var nps = String(x.npsUrl || "").trim();
    var cells = "";
    for (var i = 0; i <= 10; i++) {
      var href = nps ? nps.replace(/\{balas\}/g, i) : k.u("npsUrl");
      var bg = i <= 6 ? k.C.white : (i <= 8 ? k.C.violet200 : k.C.coral);
      cells += '<td align="center" style="padding:0 2px;"><a href="' + k.esc(href) + '" target="_blank" style="display:block;width:100%;min-width:24px;padding:9px 0;border-radius:10px;background:' + bg + ';border:1px solid ' + k.C.ink + ';font-family:Manrope,Arial,sans-serif;font-size:14px;font-weight:700;color:' + k.C.ink + ';text-decoration:none;">' + i + '</a></td>';
    }
    return k.p("ačiū, kad buvote kartu mokymuose <b>„" + k.esc(x.title) + "“</b>! Tikimės, kad išsinešėte ne tik žinių, bet ir kelias jau veikiančias Claude užduotis.") +
      k.card(
        k.cardLabel("Mokymų medžiaga") +
        k.bullets(["Mokymų skaidrės", "Užklausų (promptų) šablonai, kuriuos galite naudoti iškart"], true) +
        '<div style="height:6px;line-height:6px;">&nbsp;</div>' +
        k.button(k.u("materialsUrl"), "Atsisiųsti medžiagą")
      ) +
      k.heading("Kaip vertinate mokymus?") +
      k.p("Kokia tikimybė, kad rekomenduotumėte šiuos mokymus kolegai ar draugui? Paspauskite skaičių, užtruks mažiau nei minutę.") +
      '<tr><td style="padding:0 30px 6px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>' + cells + '</tr></table></td></tr>' +
      '<tr><td style="padding:0 32px 20px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>' +
        '<td style="font-family:Arial,sans-serif;font-size:12px;color:' + k.C.inkSoft + ';">0 – tikrai ne</td>' +
        '<td align="right" style="font-family:Arial,sans-serif;font-size:12px;color:' + k.C.inkSoft + ';">10 – tikrai taip</td>' +
      '</tr></table></td></tr>' +
      k.card(k.cardLabel("Patarimas") + k.cardText("Per artimiausią savaitę pritaikykite bent vieną užduotį savo darbe. Taip naujas įprotis įsitvirtina greičiausiai.", true), { bg: k.C.violet100, accent: k.C.coral }) +
      k.p("Jei kils klausimų taikant Claude, parašykite. Mielai padėsime.");
  }
});
</script>
</body>
</html>
